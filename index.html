<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD Online - Pharmacist Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .tab-btn:not(.active) { background-color: #f3f4f6; color: #4b5563; }
        .tab-btn:not(.active):hover { background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header & Patient Info -->
        <div class="bg-blue-600 p-6 text-white">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-semibold">OPD Online (Pharmacist Note)</h1>
                <button onclick="resetForm()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    ล้างข้อมูลคนไข้
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">HN</label>
                    <input type="text" id="hn" class="w-full rounded-lg border-none px-4 py-2 text-gray-900 focus:ring-2 focus:ring-blue-300" placeholder="ระบุ HN" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="ptName" class="w-full rounded-lg border-none px-4 py-2 text-gray-900 focus:ring-2 focus:ring-blue-300" placeholder="ระบุ ชื่อ-นามสกุล" oninput="generateOutput()">
                </div>
            </div>
        </div>

        <!-- Clinic Tabs -->
        <div class="p-6 border-b border-gray-200 bg-gray-50">
            <h2 class="text-lg font-medium text-gray-700 mb-3">เลือกคลินิก</h2>
            <div class="flex flex-wrap gap-3">
                <button onclick="switchTab('MR')" id="tab-MR" class="tab-btn active px-6 py-2 rounded-full font-medium border shadow-sm">1. MR</button>
                <a href="https://apps-npr.github.io/preop/" target="_blank" class="tab-btn bg-purple-100 text-purple-700 hover:bg-purple-200 border-purple-200 px-6 py-2 rounded-full font-medium border shadow-sm flex items-center">
                    2. Pre-OP
                </a>
                <button onclick="switchTab('ADR')" id="tab-ADR" class="tab-btn px-6 py-2 rounded-full font-medium border shadow-sm">3. ADR/SE</button>
                <button onclick="switchTab('HIV')" id="tab-HIV" class="tab-btn px-6 py-2 rounded-full font-medium border shadow-sm">4. Clinic HIV</button>
            </div>
        </div>

        <!-- Forms Container -->
        <div class="p-6">
            
            <!-- 1. MR Form -->
            <div id="form-MR" class="space-y-4">
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทการทำ MR</label>
                    <div class="flex gap-6">
                        <label class="inline-flex items-center">
                            <input type="radio" name="mrType" value="phone" class="form-radio text-blue-600" onchange="generateOutput()">
                            <span class="ml-2">จากการโทรสอบถามยาที่อื่น</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="mrType" value="patient" class="form-radio text-blue-600" onchange="generateOutput()">
                            <span class="ml-2">จากการดูซองยา / สอบถามคนไข้</span>
                        </label>
                    </div>
                </div>

                <div id="mrSourcesContainer" class="space-y-4 mb-2"></div>
                
                <button onclick="addMrSource()" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center mb-4 w-full justify-center border border-indigo-200 shadow-sm">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    เพิ่มสถานที่รับยา (กรณีรับยามาจากหลายที่)
                </button>

                <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                    <label class="inline-flex items-center mb-2">
                        <input type="checkbox" id="mrAllergyCheck" class="form-checkbox text-red-600 rounded" onchange="toggleAllergyInput(); generateOutput()">
                        <span class="ml-2 font-medium text-red-700">มีประวัติแพ้ยา</span>
                    </label>
                    <input type="text" id="mrAllergyDetail" placeholder="ระบุ ชื่อยา/อาการที่แพ้ เช่น Amoxicillin/ผื่นคัน" class="w-full rounded-lg border-gray-300 border px-3 py-2 hidden" oninput="generateOutput()">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">สมุนไพร / อาหารเสริม</label>
                        <input type="text" id="mrHerb" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เว้นว่างไว้หากไม่มี" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความเพิ่มเติม (ก่อนลงชื่อ)</label>
                        <input type="text" id="mrExtraNote" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="Note อื่นๆ..." oninput="generateOutput()">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ผู้บันทึก</label>
                    <div class="flex gap-2 w-full md:w-1/2">
                        <select id="mrPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                            <option value="ภก.">ภก.</option>
                            <option value="ภญ.">ภญ.</option>
                        </select>
                        <input type="text" id="mrPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2 flex-grow" placeholder="ระบุชื่อ เช่น กันตพงศ์" oninput="generateOutput()">
                    </div>
                </div>
            </div>

            <!-- 3. ADR Form -->
            <div id="form-ADR" class="space-y-4 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ป่วยรับยาจาก</label>
                        <input type="text" id="adrPlace" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น รพ.นพรัตนฯ" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่รับยา</label>
                        <input type="text" id="adrDate" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="วว/ดด/พศ เช่น 18/09/69" oninput="generateOutput()">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รายการยา</label>
                    <input type="text" id="adrDrug" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น Simvastatin 20mg" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ประเมินว่าเป็นสาเหตุจากยาไหม (ระบุรายละเอียด)</label>
                    <input type="text" id="adrAssessment" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น ปวดกล้ามเนื้อ ตั้งแต่วันที่... ไม่ค่อยสงสัย" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ประเมิน</label>
                    <div class="flex gap-2 w-full md:w-1/2">
                        <select id="adrPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                            <option value="ภก.">ภก.</option>
                            <option value="ภญ.">ภญ.</option>
                        </select>
                        <input type="text" id="adrPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2 flex-grow" placeholder="ระบุชื่อ" oninput="generateOutput()">
                    </div>
                </div>
            </div>

            <!-- 4. HIV Form -->
            <div id="form-HIV" class="space-y-6 hidden">
                
                <!-- CD4 & VL -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-4 border border-gray-200 rounded-xl shadow-sm">
                        <label class="block text-sm font-medium text-gray-700 mb-2">CD4 (%CD4)</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="hivCd4Val" placeholder="ค่า CD4 (เช่น 200)" class="w-1/2 rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                            <input type="text" id="hivCd4Percent" placeholder="%CD4 (เช่น 25.2)" class="w-1/2 rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                        <input type="text" id="hivCd4Date" placeholder="วันที่เจาะ (วว/ดด/พศ)" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm bg-gray-50" oninput="generateOutput()">
                    </div>
                    
                    <div class="bg-white p-4 border border-gray-200 rounded-xl shadow-sm">
                        <label class="block text-sm font-medium text-gray-700 mb-2">VL load</label>
                        <div class="flex gap-2 mb-2">
                            <select id="hivVlSelect" class="rounded-lg border-gray-300 border px-3 py-2 flex-grow" onchange="toggleVlInput(); generateOutput()">
                                <option value="">-- เลือกค่า VL --</option>
                                <option value="<20log<1.3"><20log<1.3</option>
                                <option value="other">อื่นๆ (ระบุเอง)</option>
                            </select>
                            
                            <div id="hivVlCustomContainer" class="hidden flex gap-2 w-full md:w-3/5">
                                <input type="text" id="hivVlVal" placeholder="ค่า (เช่น 40)" class="w-1/2 rounded-lg border-gray-300 border px-2 py-2 text-center" oninput="generateOutput()">
                                <span class="self-center font-semibold text-gray-500">log</span>
                                <input type="text" id="hivVlLog" placeholder="log (เช่น 1.45)" class="w-1/2 rounded-lg border-gray-300 border px-2 py-2 text-center" oninput="generateOutput()">
                            </div>
                        </div>
                        <input type="text" id="hivVlDate" placeholder="วันที่เจาะ (วว/ดด/พศ)" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm bg-gray-50" oninput="generateOutput()">
                    </div>
                </div>

                <!-- Labs -->
                <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-3 gap-2">
                        <label class="block text-sm font-semibold text-indigo-900">เพิ่มผล Lab</label>
                        
                        <div class="flex items-center text-sm bg-white px-2 py-1.5 rounded border border-indigo-200">
                            <span class="mr-2 text-gray-600">วันที่ Lab หลัก:</span>
                            <select id="hivLabDateRef" class="border-none text-indigo-700 focus:ring-0 cursor-pointer font-medium" onchange="toggleLabDateCustom(); generateOutput()">
                                <option value="cd4">ใช้วันที่เดียวกับ CD4</option>
                                <option value="vl">ใช้วันที่เดียวกับ VL</option>
                                <option value="custom">ระบุวันที่เอง</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="hivLabDateCustomContainer" class="mb-3 hidden">
                        <input type="text" id="hivLabDate" placeholder="วันที่เจาะ Lab หลัก (วว/ดด/พศ)" class="w-full md:w-1/3 rounded-lg border-gray-300 border px-3 py-2 text-sm shadow-sm" oninput="generateOutput()">
                    </div>

                    <!-- ค่า Lab หลัก (ใช้วันที่หลัก) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 bg-white p-4 rounded-lg border border-indigo-200 shadow-sm">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Scr</label>
                            <input type="text" id="hivScr" placeholder="ระบุค่า Scr" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">eGFR (CKD-EPI)</label>
                            <input type="text" id="hivEgfr" placeholder="ระบุค่า eGFR" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                    </div>

                    <!-- เพิ่ม Lab อิสระ -->
                    <div class="bg-white p-3 rounded-lg border border-indigo-200">
                        <div class="flex flex-col md:flex-row gap-2">
                            <select id="labSelect" class="rounded-lg border-gray-300 border px-2 py-2 w-full md:w-1/4 text-sm bg-gray-50">
                                <option value="">-- เลือก Lab --</option>
                                <option value="BUN">BUN</option>
                                <option value="Glucose">FBS</option>
                                <option value="Cholesterol">Cholesterol</option>
                                <option value="Triglyceride">TG</option>
                                <option value="HDL-C">HDL-C</option>
                                <option value="LDL-C">LDL-C</option>
                                <option value="AST">AST</option>
                                <option value="ALT">ALT</option>
                                <option value="Hb">Hb</option>
                                <option value="HCT">HCT</option>
                            </select>
                            <input type="text" id="labValue" placeholder="ผลเลือด" class="rounded-lg border-gray-300 border px-3 py-2 w-full md:w-1/4" onkeypress="if(event.key === 'Enter') addLab()">
                            <input type="text" id="labSpecificDate" placeholder="วันที่เจาะ (เว้นว่างเพื่อใช้วันที่หลัก)" class="rounded-lg border-gray-300 border px-3 py-2 w-full md:w-1/3 text-sm" onkeypress="if(event.key === 'Enter') addLab()">
                            
                            <button onclick="addLab()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 whitespace-nowrap font-medium shadow-sm">เพิ่ม</button>
                        </div>
                        <div id="labTags" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    
                    <div class="mt-3">
                        <input type="text" id="hivLabsText" placeholder="หรือพิมพ์ Lab อื่นๆ แบบอิสระเต็มประโยคที่นี่..." class="w-full text-sm rounded-lg border-gray-300 border px-3 py-2 bg-white" oninput="generateOutput()">
                    </div>
                </div>

                <!-- ข้อมูลยา HIV -->
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                    <label class="block text-sm font-semibold text-blue-900 mb-3">ข้อมูลยา & การคำนวณ % Adherence</label>
                    
                    <div id="hivDrugsContainer" class="space-y-3 mb-3"></div>
                    
                    <button onclick="addHivDrugRow()" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center mb-4 border border-blue-200">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        เพิ่มรายการยา HIV
                    </button>

                    <div class="border-t border-blue-200 pt-3">
                        <label class="inline-flex items-center text-sm font-medium text-blue-900 mb-3 bg-white px-3 py-1 rounded-full border border-blue-200 shadow-sm cursor-pointer">
                            <input type="checkbox" id="hivCalcAdherence" class="form-checkbox text-blue-600 rounded mr-2" onchange="toggleAdherence(); generateOutput()">
                            ให้ระบบคำนวณ % Adherence อัตโนมัติ
                        </label>
                        
                        <!-- Manual Adherence -->
                        <div id="adherenceManualContainer" class="mb-2">
                            <label class="block text-xs text-gray-600 mb-1">Adherence (%) - พิมพ์เอง</label>
                            <input type="text" id="hivManualAdherence" value="100%" class="w-full md:w-1/3 rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>

                        <!-- Auto Adherence -->
                        <div id="adherenceAutoContainer" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-3 rounded-lg border border-blue-100">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">นัดกี่วัน?</label>
                                <input type="number" id="hivDays" placeholder="เช่น 180" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">ทานรวมกี่มื้อต่อวัน?</label>
                                <input type="number" id="hivDoses" placeholder="เช่น 1" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="block text-xs text-red-500 mb-1">ลืมไปกี่มื้อ?</label>
                                <input type="number" id="hivMissed" placeholder="เช่น 0" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- การตัดสินใจ -->
                <div class="bg-yellow-50 p-4 border border-yellow-200 rounded-xl">
                    <label class="block text-sm font-semibold text-yellow-900 mb-3">การจัดการ / แผนการรักษา</label>
                    <div class="flex gap-4 border-b border-yellow-200 pb-3 mb-4">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="hivType" value="refill" checked class="form-radio text-blue-600 h-5 w-5" onchange="toggleHivType(); generateOutput()">
                            <span class="ml-2 font-medium text-gray-800">1) เติมยาให้แพทย์ (ผ่าน)</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="hivType" value="refer" class="form-radio text-red-600 h-5 w-5" onchange="toggleHivType(); generateOutput()">
                            <span class="ml-2 font-medium text-red-700">2) ส่งพบแพทย์ (ปรึกษาความผิดปกติ)</span>
                        </label>
                    </div>

                    <!-- Section: เติมยาให้แพทย์ (Refill) -->
                    <div id="hivRefillSection" class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">RM วันที่</label>
                                <input type="text" id="hivRmDate" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="วว/ดด/พศ" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">จำนวน (เดือน)</label>
                                <input type="text" id="hivRmMonths" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น 6" oninput="generateOutput()">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">การเจาะ Lab ครั้งหน้า</label>
                            <div class="flex gap-2 w-full md:w-1/2">
                                <select id="hivNextLabSelect" class="rounded-lg border-gray-300 border px-3 py-2" onchange="toggleNextLabInput(); generateOutput()">
                                    <option value="">-- เลือก --</option>
                                    <option value="M1">M1</option>
                                    <option value="other">อื่นๆ (ระบุเอง)</option>
                                </select>
                                <input type="text" id="hivNextLabCustom" placeholder="ระบุ Lab เพิ่มเติม" class="w-full rounded-lg border-gray-300 border px-3 py-2 hidden" oninput="generateOutput()">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ผู้จ่ายยา</label>
                            <div class="flex gap-2 w-full md:w-1/2">
                                <select id="hivPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-gray-50" onchange="generateOutput()">
                                    <option value="ภก.">ภก.</option>
                                    <option value="ภญ.">ภญ.</option>
                                </select>
                                <input type="text" id="hivPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2 flex-grow" placeholder="ระบุชื่อ" oninput="generateOutput()">
                            </div>
                        </div>
                    </div>

                    <!-- Section: ส่งพบแพทย์ (Refer) -->
                    <div id="hivReferSection" class="hidden bg-red-50 p-4 rounded-lg border border-red-200 shadow-sm">
                        <label class="block text-sm font-medium text-red-800 mb-3">ปรึกษาแพทย์เรื่องมีความผิดปกติของ (ติ๊กเลือกเพื่อกรอกรายละเอียด)</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkHt" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Ht'); generateOutput()"><span class="ml-2 font-medium">Ht (ความดัน)</span></label>
                                <input type="text" id="txtHt" placeholder="เช่น BP 150/90" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkDm" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Dm'); generateOutput()"><span class="ml-2 font-medium">DM (เบาหวาน)</span></label>
                                <input type="text" id="txtDm" placeholder="เช่น FBS สูง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkDlp" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Dlp'); generateOutput()"><span class="ml-2 font-medium">DLP (ไขมัน)</span></label>
                                <input type="text" id="txtDlp" placeholder="เช่น LDL สูง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkLiver" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Liver'); generateOutput()"><span class="ml-2 font-medium">Liver (ตับ)</span></label>
                                <input type="text" id="txtLiver" placeholder="เช่น AST, ALT ผิดปกติ" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkCkd" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Ckd'); generateOutput()"><span class="ml-2 font-medium">CKD (ไต)</span></label>
                                <input type="text" id="txtCkd" placeholder="เช่น Scr พุ่ง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                            <div>
                                <label class="inline-flex items-center mb-1"><input type="checkbox" id="chkAnemia" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Anemia'); generateOutput()"><span class="ml-2 font-medium">CBC / Anemia</span></label>
                                <input type="text" id="txtAnemia" placeholder="เช่น Hct ต่ำ" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ส่งปรึกษา</label>
                            <div class="flex gap-2 w-full md:w-1/2">
                                <select id="hivPharmTitleRefer" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                                    <option value="ภก.">ภก.</option>
                                    <option value="ภญ.">ภญ.</option>
                                </select>
                                <input type="text" id="hivPharmNameRefer" class="w-full rounded-lg border-gray-300 border px-3 py-2 flex-grow" placeholder="ระบุชื่อ" oninput="generateOutput()">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Output & Actions -->
        <div class="bg-gray-100 p-6 border-t border-gray-200">
            <label class="block text-sm font-medium text-gray-700 mb-2">Pharmacist Note (สำหรับลง PMK)</label>
            <textarea id="outputPmk" rows="12" class="w-full rounded-lg border-gray-300 border px-4 py-3 bg-white font-mono text-sm mb-4 leading-relaxed shadow-inner" readonly placeholder="ข้อความ Pharmacist Note จะค่อยๆ ปรากฏขึ้นที่นี่"></textarea>
            
            <div class="flex flex-wrap gap-4">
                <button onclick="copyToClipboard('outputPmk')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium shadow-md transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    1. คัดลอกลง PMK
                </button>
                <button onclick="copyToSheet()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium shadow-md transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    2. คัดลอกลง Google Sheet (วางลง Col B)
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        คัดลอกข้อมูลเรียบร้อยแล้ว!
    </div>

    <script>
        let currentTab = 'MR';
        let mrSources = [ { place: '', date: '', drugs: [""] } ];
        let selectedLabs = []; 
        let hivDrugs = [ { name: '', usage: '', time: '' } ]; 

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            ['MR', 'ADR', 'HIV'].forEach(t => { document.getElementById(`form-${t}`).classList.add('hidden'); });
            document.getElementById(`form-${tab}`).classList.remove('hidden');
            generateOutput();
        }

        // --- MR ---
        function renderMrSources() {
            const container = document.getElementById('mrSourcesContainer');
            container.innerHTML = '';
            mrSources.forEach((src, srcIndex) => {
                let drugInputs = src.drugs.map((d, dIndex) => `
                    <div class="flex gap-2 items-center mb-2 pl-4">
                        <span class="font-medium text-gray-500 w-4">${dIndex + 1}.</span>
                        <input type="text" value="${d}" oninput="updateMrDrug(${srcIndex}, ${dIndex}, this.value)" class="flex-1 rounded-lg border-gray-300 border px-3 py-1.5 text-sm" placeholder="ชื่อยา ขนาด วิธีใช้">
                        <button onclick="removeMrDrug(${srcIndex}, ${dIndex})" class="text-red-400 hover:text-red-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm relative">
                        ${mrSources.length > 1 ? `<button onclick="removeMrSource(${srcIndex})" class="absolute top-2 right-2 text-red-500 hover:bg-red-50 p-1 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>` : ''}
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3 pr-8">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">สถานที่รับยา</label>
                                <input type="text" value="${src.place}" oninput="updateMrSource(${srcIndex}, 'place', this.value)" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="เช่น รพ. A">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">วันที่รับยา</label>
                                <input type="text" value="${src.date}" oninput="updateMrSource(${srcIndex}, 'date', this.value)" class="w-full rounded-lg border-gray-300 border px-3 py-2 text-sm" placeholder="เช่น 18/09/69">
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <label class="block text-xs font-medium text-gray-700 mb-2 bg-gray-100 px-2 py-1 rounded inline-block">รายการยา</label>
                            ${drugInputs}
                            <button onclick="addMrDrug(${srcIndex})" class="text-xs text-blue-600 hover:text-blue-800 ml-4 font-medium flex items-center mt-1">+ เพิ่มรายการยาในสถานที่นี้</button>
                        </div>
                    </div>
                `;
            });
            generateOutput();
        }
        function addMrSource() { mrSources.push({ place: '', date: '', drugs: [""] }); renderMrSources(); }
        function removeMrSource(idx) { mrSources.splice(idx, 1); renderMrSources(); }
        function updateMrSource(idx, field, val) { mrSources[idx][field] = val; generateOutput(); }
        function addMrDrug(srcIdx) { mrSources[srcIdx].drugs.push(""); renderMrSources(); }
        function updateMrDrug(srcIdx, drugIdx, val) { mrSources[srcIdx].drugs[drugIdx] = val; generateOutput(); }
        function removeMrDrug(srcIdx, drugIdx) { 
            mrSources[srcIdx].drugs.splice(drugIdx, 1); 
            if(mrSources[srcIdx].drugs.length === 0) mrSources[srcIdx].drugs.push("");
            renderMrSources(); 
        }
        function toggleAllergyInput() {
            const input = document.getElementById('mrAllergyDetail');
            document.getElementById('mrAllergyCheck').checked ? input.classList.remove('hidden') : input.classList.add('hidden');
        }

        // --- HIV ---
        function renderHivDrugs() {
            const container = document.getElementById('hivDrugsContainer');
            container.innerHTML = '';
            hivDrugs.forEach((drug, index) => {
                container.innerHTML += `
                    <div class="flex flex-col md:flex-row gap-2 items-center bg-white p-2 rounded-lg border border-gray-200">
                        <span class="font-bold text-blue-500 w-4 text-center text-sm">${index+1}.</span>
                        <input type="text" value="${drug.name}" oninput="updateHivDrug(${index}, 'name', this.value)" placeholder="ชื่อยา (เช่น TDF)" class="w-full md:w-2/5 rounded-lg border-gray-300 border px-3 py-1.5 text-sm">
                        <input type="text" value="${drug.usage}" oninput="updateHivDrug(${index}, 'usage', this.value)" placeholder="วิธีใช้ (เช่น 1x1 po)" class="w-full md:w-1/4 rounded-lg border-gray-300 border px-3 py-1.5 text-sm">
                        <input type="text" value="${drug.time}" oninput="updateHivDrug(${index}, 'time', this.value)" placeholder="เวลา (เช่น 20.00)" class="w-full md:w-1/4 rounded-lg border-gray-300 border px-3 py-1.5 text-sm">
                        <button onclick="removeHivDrug(${index})" class="text-red-400 hover:text-red-600 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
            });
            generateOutput();
        }
        function addHivDrugRow() { hivDrugs.push({name:'', usage:'', time:''}); renderHivDrugs(); }
        function updateHivDrug(idx, field, val) { hivDrugs[idx][field] = val; generateOutput(); }
        function removeHivDrug(idx) { 
            hivDrugs.splice(idx, 1); 
            if(hivDrugs.length===0) hivDrugs.push({name:'', usage:'', time:''}); 
            renderHivDrugs(); 
        }

        function toggleAdherence() {
            const isAuto = document.getElementById('hivCalcAdherence').checked;
            if(isAuto) {
                document.getElementById('adherenceAutoContainer').classList.remove('hidden');
                document.getElementById('adherenceManualContainer').classList.add('hidden');
            } else {
                document.getElementById('adherenceAutoContainer').classList.add('hidden');
                document.getElementById('adherenceManualContainer').classList.remove('hidden');
            }
        }

        function toggleHivType() {
            const isRefill = document.querySelector('input[name="hivType"]:checked').value === 'refill';
            if (isRefill) {
                document.getElementById('hivRefillSection').classList.remove('hidden');
                document.getElementById('hivReferSection').classList.add('hidden');
            } else {
                document.getElementById('hivRefillSection').classList.add('hidden');
                document.getElementById('hivReferSection').classList.remove('hidden');
            }
        }
        
        function toggleVlInput() {
            const select = document.getElementById('hivVlSelect');
            const custom = document.getElementById('hivVlCustomContainer');
            if(select.value === 'other') { custom.classList.remove('hidden'); custom.classList.add('flex'); select.classList.remove('flex-grow'); } 
            else { custom.classList.add('hidden'); custom.classList.remove('flex'); select.classList.add('flex-grow'); }
        }

        function toggleNextLabInput() {
            const select = document.getElementById('hivNextLabSelect');
            const custom = document.getElementById('hivNextLabCustom');
            if(select.value === 'other') { custom.classList.remove('hidden'); } 
            else { custom.classList.add('hidden'); }
        }
        
        function toggleLabDateCustom() {
            const select = document.getElementById('hivLabDateRef').value;
            const container = document.getElementById('hivLabDateCustomContainer');
            if(select === 'custom') { container.classList.remove('hidden'); }
            else { container.classList.add('hidden'); }
        }

        function toggleReferInput(id) {
            const input = document.getElementById(`txt${id}`);
            document.getElementById(`chk${id}`).checked ? input.classList.remove('hidden') : input.classList.add('hidden');
        }

        function addLab() {
            const select = document.getElementById('labSelect');
            const labName = select.options[select.selectedIndex].value;
            const labVal = document.getElementById('labValue').value;
            const labDate = document.getElementById('labSpecificDate').value;
            
            if (labName && labVal) {
                selectedLabs.push({ name: labName, val: labVal, date: labDate });
                document.getElementById('labValue').value = '';
                document.getElementById('labSpecificDate').value = '';
                select.selectedIndex = 0;
                renderLabTags();
                generateOutput();
            }
        }

        function removeLab(index) {
            selectedLabs.splice(index, 1);
            renderLabTags();
            generateOutput();
        }

        function renderLabTags() {
            const container = document.getElementById('labTags');
            container.innerHTML = '';
            selectedLabs.forEach((lab, index) => {
                let text = `${lab.name} ${lab.val}`;
                if(lab.date) text += ` (วันที่ ${lab.date})`;
                container.innerHTML += `
                    <span class="inline-flex items-center gap-1 bg-white border border-indigo-200 text-indigo-800 text-sm font-medium px-2.5 py-1.5 rounded-full shadow-sm">
                        ${text}
                        <button onclick="removeLab(${index})" class="text-indigo-400 hover:text-red-500 font-bold ml-1">&times;</button>
                    </span>
                `;
            });
        }

        function resetForm() {
            if(confirm('ต้องการล้างข้อมูลคนไข้ทั้งหมดหรือไม่?')) {
                document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => el.value = '');
                document.querySelectorAll('input[type="checkbox"]').forEach(el => { el.checked = false; });
                
                document.getElementById('hivManualAdherence').value = '100%';
                document.getElementById('hivLabDateRef').value = 'cd4';
                
                document.querySelector('input[name="mrType"][value="phone"]').checked = false;
                document.querySelector('input[name="mrType"][value="patient"]').checked = false;
                document.querySelector('input[name="hivType"][value="refill"]').checked = true;
                document.getElementById('hivVlSelect').selectedIndex = 0;
                document.getElementById('hivNextLabSelect').selectedIndex = 0;
                
                toggleVlInput(); toggleNextLabInput(); toggleAdherence(); toggleLabDateCustom();
                
                mrSources = [ { place: '', date: '', drugs: [""] } ];
                selectedLabs = []; 
                hivDrugs = [ { name: '', usage: '', time: '' } ];
                
                renderLabTags(); renderMrSources(); renderHivDrugs(); toggleHivType(); generateOutput();
            }
        }

        function formatTime(timeStr) {
            if(!timeStr) return "";
            timeStr = timeStr.trim();
            // ถ้ากรอกมาแค่ตัวเลขหรือจุด (เช่น 20.00) ให้เติม น.
            if (timeStr.match(/^[0-9:\.]+$/) && !timeStr.includes('น.')) {
                return `${timeStr} น.`;
            }
            return timeStr;
        }

        function generateOutput() {
            let notes = [];
            
            if (currentTab === 'MR') {
                const hasAllergy = document.getElementById('mrAllergyCheck').checked;
                const herb = document.getElementById('mrHerb').value;
                const extraNote = document.getElementById('mrExtraNote').value;
                const pharmTitle = document.getElementById('mrPharmTitle').value;
                const pharmName = document.getElementById('mrPharmName').value;

                let hasAnyData = mrSources.some(s => s.place || s.date || s.drugs.some(d => d.trim())) || hasAllergy || herb || pharmName;

                if (hasAnyData) {
                    notes.push("pharmacist note");
                    
                    mrSources.forEach((src) => {
                        let validDrugs = src.drugs.filter(d => d.trim() !== '');
                        if (src.place || src.date || validDrugs.length > 0) {
                            let line = [];
                            if(src.place) line.push(`ผู้ป่วยรับยาจาก ${src.place}`);
                            if(src.date) line.push(`วันที่ ${src.date}`);
                            if(line.length > 0) notes.push(`- ${line.join(' ')}`);
                            
                            if (validDrugs.length > 0) {
                                notes.push("รายการยา");
                                validDrugs.forEach((d, i) => { notes.push(`  ${i + 1}. ${d}`); });
                            }
                        }
                    });

                    let allergyText = hasAllergy ? `แพ้ยา/แพ้อาหาร: ${document.getElementById('mrAllergyDetail').value || 'ไม่ระบุ'}` : `แพ้ยา/แพ้อาหาร: ปฏิเสธ`;
                    let herbText = herb ? `สมุนไพร/อาหารเสริม: ${herb}` : `สมุนไพร/อาหารเสริม: -`;
                    notes.push(`${allergyText} | ${herbText}`);
                    
                    if (extraNote) notes.push(extraNote);
                    if (pharmName) notes.push(`/${pharmTitle}${pharmName}`);
                }
            } 
            else if (currentTab === 'ADR') {
                const place = document.getElementById('adrPlace').value;
                const date = document.getElementById('adrDate').value;
                const drug = document.getElementById('adrDrug').value;
                const assess = document.getElementById('adrAssessment').value;
                const pharmTitle = document.getElementById('adrPharmTitle').value;
                const pharmName = document.getElementById('adrPharmName').value;

                if (place || date || drug || assess || pharmName) {
                    notes.push("pharmacist note");
                    let line1 = [];
                    if (place) line1.push(`ผู้ป่วยรับยาจาก ${place}`);
                    if (date) line1.push(`วันที่ ${date}`);
                    if (line1.length > 0) notes.push(line1.join(' '));

                    let line2 = [];
                    if (drug) line2.push(`รายการยา ${drug}`);
                    if (assess) line2.push(`${assess}`); 
                    if (line2.length > 0) notes.push(line2.join(' '));
                    if (pharmName) notes.push(`/${pharmTitle}${pharmName}`);
                }
            }
            else if (currentTab === 'HIV') {
                notes.push("pharmacist note");
                
                // CD4
                const cd4Val = document.getElementById('hivCd4Val').value;
                const cd4Per = document.getElementById('hivCd4Percent').value;
                const cd4Date = document.getElementById('hivCd4Date').value;
                let cd4Str = '';
                if(cd4Val && cd4Per) cd4Str = `CD4 = ${cd4Val}(${cd4Per}%)`;
                else if (cd4Val) cd4Str = `CD4 = ${cd4Val}`;
                else if (cd4Per) cd4Str = `CD4 = (${cd4Per}%)`;
                if (cd4Str && cd4Date) cd4Str += ` วันที่ ${cd4Date}`;

                // VL
                const vlSel = document.getElementById('hivVlSelect').value;
                const vlVal = document.getElementById('hivVlVal').value;
                const vlLog = document.getElementById('hivVlLog').value;
                const vlDate = document.getElementById('hivVlDate').value;
                let vlStr = '';
                let finalVl = "";
                if (vlSel === 'other') {
                    if(vlVal && vlLog) finalVl = `${vlVal}log${vlLog}`;
                    else if(vlVal) finalVl = vlVal;
                } else {
                    finalVl = vlSel;
                }
                if(finalVl) vlStr = `VL load ${finalVl}`;
                if(vlStr && vlDate) vlStr += ` วันที่ ${vlDate}`;

                let cd4vlLine = [];
                if(cd4Str) cd4vlLine.push(cd4Str);
                if(vlStr) cd4vlLine.push(vlStr);
                if (cd4vlLine.length > 0) notes.push(cd4vlLine.join(' '));

                // Labs Grouping
                const type = document.querySelector('input[name="hivType"]:checked').value;
                const labPrefix = type === 'refill' ? 'Lab' : 'Lab ที่มีปัญหา';
                
                const labDateRef = document.getElementById('hivLabDateRef').value;
                let mainLabDate = "";
                if (labDateRef === 'cd4') mainLabDate = cd4Date;
                else if (labDateRef === 'vl') mainLabDate = vlDate;
                else if (labDateRef === 'custom') mainLabDate = document.getElementById('hivLabDate').value;

                let labStringsMain = [];
                let labStringsSpecific = [];

                if (document.getElementById('hivScr').value) labStringsMain.push(`Scr ${document.getElementById('hivScr').value}`);
                if (document.getElementById('hivEgfr').value) labStringsMain.push(`eGFR ${document.getElementById('hivEgfr').value}`);
                
                if (selectedLabs.length > 0) {
                    selectedLabs.forEach(lab => {
                        if(lab.date) {
                            labStringsSpecific.push(`${lab.name} ${lab.val} (วันที่ ${lab.date})`);
                        } else {
                            labStringsMain.push(`${lab.name} ${lab.val}`);
                        }
                    });
                }

                let allLabs = [];
                if (labStringsMain.length > 0) {
                    let str = labStringsMain.join(', ');
                    if (mainLabDate) str += ` (วันที่ ${mainLabDate})`;
                    allLabs.push(str);
                }
                if (labStringsSpecific.length > 0) {
                    allLabs.push(labStringsSpecific.join(', '));
                }

                const extraLabs = document.getElementById('hivLabsText').value;
                if (extraLabs) allLabs.push(extraLabs);
                
                if (allLabs.length > 0) {
                    notes.push(`${labPrefix}: ${allLabs.join(', ')}`);
                }

                // Drug & Adherence
                let drugLines = [];
                hivDrugs.forEach(d => {
                    let parts = [];
                    if(d.name) parts.push(d.name);
                    if(d.usage) parts.push(d.usage);
                    if(d.time) parts.push(formatTime(d.time));
                    if(parts.length > 0) drugLines.push(parts.join(' '));
                });
                
                let drugLineOutput = drugLines.length > 0 ? `on ${drugLines.join(', ')}` : "";

                const isAutoCalc = document.getElementById('hivCalcAdherence').checked;
                let adherenceStr = "";

                if (isAutoCalc) {
                    const days = parseFloat(document.getElementById('hivDays').value);
                    const doses = parseFloat(document.getElementById('hivDoses').value);
                    if (days && doses) {
                        const missed = parseFloat(document.getElementById('hivMissed').value) || 0;
                        const totalM = days * doses;
                        const taken = totalM - missed;
                        const adPercent = totalM > 0 ? ((taken/totalM)*100).toFixed(2) : 0;
                        
                        adherenceStr = `adherence ${adPercent}%`;
                        if(drugLineOutput) {
                            notes.push(`${drugLineOutput} ${adherenceStr}`);
                        }
                        notes.push(`นัด ${days}วัน ลืมไป ${missed} มื้อ (${taken}/${totalM}*100 = ${adPercent}%)`);
                    } else if (drugLineOutput) {
                        notes.push(drugLineOutput);
                    }
                } else {
                    const manualAdh = document.getElementById('hivManualAdherence').value;
                    if(manualAdh) adherenceStr = `adherence ${manualAdh}`;
                    if(drugLineOutput) {
                        notes.push(adherenceStr ? `${drugLineOutput} ${adherenceStr}` : drugLineOutput);
                    }
                }

                if (type === 'refill') {
                    const rmDate = document.getElementById('hivRmDate').value;
                    const rmMonths = document.getElementById('hivRmMonths').value;
                    const nextLabSel = document.getElementById('hivNextLabSelect').value;
                    const nextLabCust = document.getElementById('hivNextLabCustom').value;
                    const nextLab = nextLabSel === 'other' ? nextLabCust : nextLabSel;
                    const pharmTitle = document.getElementById('hivPharmTitle').value;
                    const pharmName = document.getElementById('hivPharmName').value;
                    
                    let rmLine = [];
                    if (rmDate) rmLine.push(`RM ${rmDate}`);
                    if (rmMonths) rmLine.push(`จำนวน ${rmMonths} เดือน`);
                    if (nextLab) rmLine.push(`+ Lab ${nextLab}`);
                    if (rmLine.length > 0) notes.push(rmLine.join(' '));
                    
                    if (pharmName) notes.push(`รคส. พญ. วรวรรณ/ ${pharmTitle} ${pharmName}`);
                    
                } else {
                    let issues = [];
                    ['Ht', 'Dm', 'Dlp', 'Liver', 'Ckd', 'Anemia'].forEach(id => {
                        if(document.getElementById(`chk${id}`).checked) {
                            let label = document.querySelector(`label[for="chk${id}"]`)?.innerText.split(' ')[0] || id; 
                            let val = document.getElementById(`txt${id}`).value;
                            issues.push(val ? `${label} (มี ${val})` : label);
                        }
                    });
                    if (issues.length > 0) notes.push(`ปรึกษาแพทย์เรื่องมีความผิดปกติของ ${issues.join(' ')}`);
                    
                    const pharmTitle = document.getElementById('hivPharmTitleRefer').value;
                    const pharmName = document.getElementById('hivPharmNameRefer').value;
                    if (pharmName) notes.push(`รคส. พญ. วรวรรณ/ ${pharmTitle}${pharmName}`);
                }
            }
            
            document.getElementById('outputPmk').value = notes.join('\n');
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            if(text) { navigator.clipboard.writeText(text).then(() => showToast('คัดลอกลง PMK เรียบร้อยแล้ว!')); }
        }

        function copyToSheet() {
            let rowData = Array(18).fill('');
            rowData[0] = document.getElementById('hn').value;
            rowData[1] = document.getElementById('ptName').value;
            
            if (currentTab === 'MR') {
                const mrType = document.querySelector('input[name="mrType"]:checked')?.value;
                if(mrType === 'phone') rowData[3] = '1';
                if(mrType === 'patient') rowData[4] = '1';
                if(document.getElementById('mrAllergyCheck').checked) {
                    rowData[6] = '1'; 
                    rowData[9] = document.getElementById('mrAllergyDetail').value;
                }
                
                let allPlaces = mrSources.map(s => s.place).filter(p => p).join(', ');
                let allDrugs = [];
                mrSources.forEach(s => { s.drugs.filter(d => d.trim() !== '').forEach(d => allDrugs.push(d)); });
                
                rowData[10] = allPlaces; 
                rowData[11] = allDrugs.join(', ');
            } 
            else if (currentTab === 'ADR') {
                rowData[7] = '1';
                rowData[9] = document.getElementById('adrAssessment').value;
            }
            else if (currentTab === 'HIV') {
                const type = document.querySelector('input[name="hivType"]:checked').value;
                if (type === 'refer') {
                    let referDetails = [];
                    if(document.getElementById('chkHt').checked) { referDetails.push(`ความดัน มี ${document.getElementById('txtHt').value}`); rowData[12] = '1'; }
                    if(document.getElementById('chkDm').checked) { referDetails.push(`เบาหวาน มี ${document.getElementById('txtDm').value}`); rowData[13] = '1'; }
                    if(document.getElementById('chkDlp').checked) { referDetails.push(`ไขมัน มี ${document.getElementById('txtDlp').value}`); rowData[14] = '1'; }
                    if(document.getElementById('chkLiver').checked) { referDetails.push(`ตับ มี ${document.getElementById('txtLiver').value}`); rowData[15] = '1'; }
                    if(document.getElementById('chkCkd').checked) { referDetails.push(`CKD มี ${document.getElementById('txtCkd').value}`); rowData[16] = '1'; }
                    if(document.getElementById('chkAnemia').checked) { referDetails.push(`CBC มี ${document.getElementById('txtAnemia').value}`); rowData[17] = '1'; }
                    
                    if(referDetails.length > 0) { rowData[6] = `ส่งพบเรื่อง ${referDetails.join(', ')}`; }
                }
            }

            const tsvString = rowData.join('\t');
            navigator.clipboard.writeText(tsvString).then(() => { showToast('คัดลอกข้อมูลสำหรับลง Google Sheet เรียบร้อยแล้ว!'); });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        renderMrSources();
        renderHivDrugs();
        generateOutput();
    </script>
</body>
</html>
