<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPD Online - Pharmacist Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .tab-btn:not(.active) { background-color: #f3f4f6; color: #4b5563; }
        .tab-btn:not(.active):hover { background-color: #e5e7eb; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header & Patient Info -->
        <div class="bg-blue-600 p-6 text-white">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-semibold">OPD Online (Pharmacist Note)</h1>
                <button onclick="resetForm()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition">
                    ล้างข้อมูลคนไข้
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">HN</label>
                    <input type="text" id="hn" class="w-full rounded-lg border-none px-4 py-2 text-gray-900 focus:ring-2 focus:ring-blue-300" placeholder="ระบุ HN" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="ptName" class="w-full rounded-lg border-none px-4 py-2 text-gray-900 focus:ring-2 focus:ring-blue-300" placeholder="ระบุ ชื่อ-นามสกุล" oninput="generateOutput()">
                </div>
            </div>
        </div>

        <!-- Clinic Tabs -->
        <div class="p-6 border-b border-gray-200 bg-gray-50">
            <h2 class="text-lg font-medium text-gray-700 mb-3">เลือกคลินิก</h2>
            <div class="flex flex-wrap gap-3">
                <button onclick="switchTab('MR')" id="tab-MR" class="tab-btn active px-6 py-2 rounded-full font-medium border shadow-sm">1. MR</button>
                <a href="https://apps-npr.github.io/preop/" target="_blank" class="tab-btn bg-purple-100 text-purple-700 hover:bg-purple-200 border-purple-200 px-6 py-2 rounded-full font-medium border shadow-sm flex items-center">
                    2. Pre-OP
                </a>
                <button onclick="switchTab('ADR')" id="tab-ADR" class="tab-btn px-6 py-2 rounded-full font-medium border shadow-sm">3. ADR/SE</button>
                <button onclick="switchTab('HIV')" id="tab-HIV" class="tab-btn px-6 py-2 rounded-full font-medium border shadow-sm">4. Clinic HIV</button>
            </div>
        </div>

        <!-- Forms Container -->
        <div class="p-6">
            
            <!-- 1. MR Form -->
            <div id="form-MR" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ป่วยรับยาจาก (สถานที่)</label>
                        <input type="text" id="mrPlace" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น คลินิกเวชกรรมกล้วยน้ำไท คู้บอน" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่รับยา</label>
                        <input type="text" id="mrDate" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="วว/ดด/พศ เช่น 18/09/69" oninput="generateOutput()">
                    </div>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทการทำ MR</label>
                    <div class="flex gap-6">
                        <label class="inline-flex items-center">
                            <input type="radio" name="mrType" value="phone" class="form-radio text-blue-600" onchange="generateOutput()">
                            <span class="ml-2">จากการโทรสอบถามยาที่อื่น</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="mrType" value="patient" class="form-radio text-blue-600" onchange="generateOutput()">
                            <span class="ml-2">จากการดูซองยา / สอบถามคนไข้</span>
                        </label>
                    </div>
                </div>

                <!-- ระบบเพิ่มรายการยา -->
                <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                    <label class="block text-sm font-medium text-gray-700 mb-2">รายการยา (สำหรับลง PMK Note และสถิติ Col M)</label>
                    <div id="mrDrugContainer" class="space-y-2 mb-3">
                        <!-- JS จะเรนเดอร์ช่องกรอกยาที่นี่ -->
                    </div>
                    <button onclick="addMrDrugRow()" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        เพิ่มรายการยา
                    </button>
                </div>

                <div class="bg-red-50 p-4 rounded-lg border border-red-100">
                    <label class="inline-flex items-center mb-2">
                        <input type="checkbox" id="mrAllergyCheck" class="form-checkbox text-red-600 rounded" onchange="toggleAllergyInput(); generateOutput()">
                        <span class="ml-2 font-medium text-red-700">มีประวัติแพ้ยา</span>
                    </label>
                    <input type="text" id="mrAllergyDetail" placeholder="ระบุ ชื่อยา/อาการที่แพ้ เช่น Amoxicillin/ผื่นคัน" class="w-full rounded-lg border-gray-300 border px-3 py-2 hidden" oninput="generateOutput()">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">สมุนไพร / อาหารเสริม</label>
                        <input type="text" id="mrHerb" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เว้นว่างไว้หากไม่มี" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ผู้บันทึก</label>
                        <div class="flex gap-2">
                            <select id="mrPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                                <option value="ภก.">ภก.</option>
                                <option value="ภญ.">ภญ.</option>
                            </select>
                            <input type="text" id="mrPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="ระบุชื่อ เช่น กันตพงศ์" oninput="generateOutput()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. ADR Form -->
            <div id="form-ADR" class="space-y-4 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ป่วยรับยาจาก</label>
                        <input type="text" id="adrPlace" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น รพ.นพรัตนฯ" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่รับยา</label>
                        <input type="text" id="adrDate" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="วว/ดด/พศ เช่น 18/09/69" oninput="generateOutput()">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รายการยา</label>
                    <input type="text" id="adrDrug" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น Simvastatin 20mg" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ประเมินว่าเป็นสาเหตุจากยาไหม (ระบุชื่อยา/อาการ/รายละเอียด)</label>
                    <input type="text" id="adrAssessment" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="เช่น ปวดกล้ามเนื้อ ตั้งแต่วันที่... จากการสอบถามไม่ค่อยสงสัยเนื่องจากทานมานานแล้ว" oninput="generateOutput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ผู้ประเมิน</label>
                    <div class="flex gap-2">
                        <select id="adrPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                            <option value="ภก.">ภก.</option>
                            <option value="ภญ.">ภญ.</option>
                        </select>
                        <input type="text" id="adrPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="ระบุชื่อ เช่น กันตพงศ์" oninput="generateOutput()">
                    </div>
                </div>
            </div>

            <!-- 4. HIV Form -->
            <div id="form-HIV" class="space-y-4 hidden">
                
                <div class="flex gap-4 border-b border-gray-200 pb-2 mb-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="hivType" value="refill" checked class="form-radio text-blue-600" onchange="toggleHivType(); generateOutput()">
                        <span class="ml-2 font-medium">1) เติมยาให้แพทย์</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="hivType" value="refer" class="form-radio text-red-600" onchange="toggleHivType(); generateOutput()">
                        <span class="ml-2 font-medium text-red-600">2) ส่งพบแพทย์ (ปรึกษาความผิดปกติ)</span>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CD4 (%CD4) + วันที่เจาะ</label>
                        <input type="text" id="hivCd4" placeholder="เช่น 500 (15%) (01/01/67)" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">VL load + วันที่เจาะ</label>
                        <input type="text" id="hivVl" placeholder="เช่น <40 (01/01/67)" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                    </div>
                </div>

                <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                    <label class="block text-sm font-medium text-indigo-900 mb-2">เพิ่มผล Lab (ค่ามาตรฐาน รพ.)</label>
                    <div class="flex flex-col md:flex-row gap-2">
                        <select id="labSelect" class="rounded-lg border-gray-300 border px-3 py-2 flex-grow">
                            <option value="">-- เลือก Lab --</option>
                            <optgroup label="Chemistry (เคมีคลินิก)">
                                <option value="BUN">BUN</option>
                                <option value="Creatinine (Serum)">Creatinine (Serum) / Scr</option>
                                <option value="eGFR (CKD-EPI)">eGFR (CKD-EPI)</option>
                                <option value="Glucose (NaF)">Fasting Blood Sugar</option>
                                <option value="Cholesterol">Cholesterol</option>
                                <option value="Triglyceride">Triglyceride</option>
                                <option value="HDL-C">HDL-C</option>
                                <option value="LDL-C">LDL-C</option>
                                <option value="SGOT (AST)">AST / SGOT</option>
                                <option value="SGPT (ALT)">ALT / SGPT</option>
                                <option value="Total Protein">Total Protein</option>
                                <option value="Albumin">Albumin</option>
                                <option value="Sodium (Na)">Sodium (Na)</option>
                                <option value="Potassium (K)">Potassium (K)</option>
                            </optgroup>
                            <optgroup label="Hematology & Immunology">
                                <option value="Hb">Hb</option>
                                <option value="HCT">HCT</option>
                                <option value="WBC Count">WBC Count</option>
                                <option value="Pletelet Count [Plt. count]">Platelet Count</option>
                                <option value="HbA1c (CMIA)">HbA1c (CMIA)</option>
                                <option value="%CD4">%CD4</option>
                                <option value="HIV-1 RNA">HIV-1 RNA (VL)</option>
                            </optgroup>
                            <optgroup label="Urinalysis (UA)">
                                <option value="Specific Gravity (UA) [Sp.gr.]">Sp.gr.</option>
                                <option value="pH(UA)">pH</option>
                                <option value="Protein(UA)">Protein</option>
                                <option value="Sugar(UA)">Sugar</option>
                                <option value="WBC(UA)">WBC</option>
                            </optgroup>
                        </select>
                        <input type="text" id="labValue" placeholder="ระบุผลเลือด" class="rounded-lg border-gray-300 border px-3 py-2 w-full md:w-32" onkeypress="if(event.key === 'Enter') addLab()">
                        <button onclick="addLab()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 whitespace-nowrap">เพิ่ม</button>
                    </div>
                    <div id="labTags" class="flex flex-wrap gap-2 mt-3"></div>
                    <div class="mt-3 border-t border-indigo-200 pt-3">
                        <label class="block text-xs text-indigo-700 mb-1">หรือระบุ Lab อื่นๆ เพิ่มเติม (พิมพ์เอง)</label>
                        <input type="text" id="hivLabsText" placeholder="Lab อื่นๆ ที่ไม่ได้อยู่ในรายการด้านบน" class="w-full text-sm rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-sm font-medium text-blue-800 mb-2">ข้อมูลยา & การคำนวณ % Adherence</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
                        <div class="md:col-span-3">
                            <input type="text" id="hivArv" placeholder="ชื่อสูตรยา / วิธีทาน / เวลาที่ทาน" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">นัดกี่วัน?</label>
                            <input type="number" id="hivDays" placeholder="เช่น 180" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">ทานกี่มื้อต่อวัน?</label>
                            <input type="number" id="hivDoses" placeholder="เช่น 1 (สำหรับ 1x1)" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="block text-xs text-red-500 mb-1">ลืมไปกี่มื้อ?</label>
                            <input type="number" id="hivMissed" placeholder="เช่น 2" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                    </div>
                </div>

                <!-- Section: เติมยาให้แพทย์ (Refill) -->
                <div id="hivRefillSection" class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">rm วันที่</label>
                            <input type="text" id="hivRmDate" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="วว/ดด/พศ" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">จำนวน (เดือน)</label>
                            <input type="text" id="hivRmMonths" class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium text-gray-700 mb-1">การเจาะ Lab ครั้งหน้า</label>
                        <input type="text" id="hivNextLab" placeholder="เช่น เจาะ lab M1, lipid profile..." class="w-full rounded-lg border-gray-300 border px-3 py-2" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ผู้จ่ายยา</label>
                        <div class="flex gap-2">
                            <select id="hivPharmTitle" class="rounded-lg border-gray-300 border px-3 py-2 bg-white" onchange="generateOutput()">
                                <option value="ภก.">ภก.</option>
                                <option value="ภญ.">ภญ.</option>
                            </select>
                            <input type="text" id="hivPharmName" class="w-full rounded-lg border-gray-300 border px-3 py-2" placeholder="ระบุชื่อ เช่น กันตพงศ์" oninput="generateOutput()">
                        </div>
                    </div>
                </div>

                <!-- Section: ส่งพบแพทย์ (Refer) -->
                <div id="hivReferSection" class="hidden bg-red-50 p-4 rounded-lg border border-red-200">
                    <label class="block text-sm font-medium text-red-800 mb-3">ปรึกษาแพทย์เรื่องมีความผิดปกติของ (ติ๊กเลือกเพื่อกรอกรายละเอียด)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkHt" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Ht'); generateOutput()">
                                <span class="ml-2 font-medium">Ht (ความดัน)</span>
                            </label>
                            <input type="text" id="txtHt" placeholder="เช่น BP 150/90" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkDm" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Dm'); generateOutput()">
                                <span class="ml-2 font-medium">DM (เบาหวาน)</span>
                            </label>
                            <input type="text" id="txtDm" placeholder="เช่น FBS สูง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkDlp" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Dlp'); generateOutput()">
                                <span class="ml-2 font-medium">DLP (ไขมัน)</span>
                            </label>
                            <input type="text" id="txtDlp" placeholder="เช่น LDL สูง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkLiver" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Liver'); generateOutput()">
                                <span class="ml-2 font-medium">Liver (ตับ)</span>
                            </label>
                            <input type="text" id="txtLiver" placeholder="เช่น AST, ALT ผิดปกติ" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkCkd" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Ckd'); generateOutput()">
                                <span class="ml-2 font-medium">CKD (ไต)</span>
                            </label>
                            <input type="text" id="txtCkd" placeholder="เช่น Scr พุ่ง" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                        <div>
                            <label class="inline-flex items-center mb-1">
                                <input type="checkbox" id="chkAnemia" class="form-checkbox text-red-600 rounded" onchange="toggleReferInput('Anemia'); generateOutput()">
                                <span class="ml-2 font-medium">CBC / Anemia</span>
                            </label>
                            <input type="text" id="txtAnemia" placeholder="เช่น Hct ต่ำ" class="w-full text-sm rounded border-gray-300 px-2 py-1 hidden" oninput="generateOutput()">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Output & Actions -->
        <div class="bg-gray-100 p-6 border-t border-gray-200">
            <label class="block text-sm font-medium text-gray-700 mb-2">Pharmacist Note (สำหรับลง PMK)</label>
            <textarea id="outputPmk" rows="10" class="w-full rounded-lg border-gray-300 border px-4 py-3 bg-white font-mono text-sm mb-4 leading-relaxed" readonly placeholder="ข้อความ Pharmacist Note จะค่อยๆ ปรากฏขึ้นที่นี่ เมื่อคุณเริ่มกรอกข้อมูลด้านบน"></textarea>
            
            <div class="flex flex-wrap gap-4">
                <button onclick="copyToClipboard('outputPmk')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-medium shadow-md transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    1. คัดลอกลง PMK
                </button>
                <button onclick="copyToSheet()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-medium shadow-md transition flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    2. คัดลอกลง Google Sheet (วางลง Col B)
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
        คัดลอกข้อมูลเรียบร้อยแล้ว!
    </div>

    <script>
        // ฐานข้อมูล Lab ดึงจากไฟล์ lab_Reference
        const labStandards = {
            "Glucose (NaF)": { unit: "mg/dL", ref: "74 - 100" },
            "BUN": { unit: "mg/dL", ref: "8.40 - 25.7" },
            "Creatinine (Serum)": { unit: "mg/dL", ref: "0.73 - 1.18" },
            "eGFR (CKD-EPI)": { unit: "ml/min/1.73m2", ref: ">90" },
            "Cholesterol": { unit: "mg/dL", ref: "0 - 200" },
            "Triglyceride": { unit: "mg/dL", ref: "< 150" },
            "HDL-C": { unit: "mg/dL", ref: "> 55" },
            "LDL-C": { unit: "mg/dL", ref: "0 - 130" },
            "SGOT (AST)": { unit: "U/L", ref: "0 - 55" },
            "SGPT (ALT)": { unit: "U/L", ref: "5 - 34" },
            "Total Protein": { unit: "g/dL", ref: "6.40 - 8.3" },
            "Albumin": { unit: "g/dL", ref: "3.50 - 5.2" },
            "Sodium (Na)": { unit: "mmol/L", ref: "136 - 145" },
            "Potassium (K)": { unit: "mmol/L", ref: "3.50 - 5.1" },
            "Hb": { unit: "g/dL", ref: "14 - 18" },
            "HCT": { unit: "%", ref: "40 - 54" },
            "WBC Count": { unit: "10^3/uL", ref: "5 - 10" },
            "Pletelet Count [Plt. count]": { unit: "10^3/uL", ref: "140 - 400" },
            "HbA1c (CMIA)": { unit: "%", ref: "4.50 - 6.3 <6.5" },
            "%CD4": { unit: "%", ref: "24.10 - 50.7" },
            "HIV-1 RNA": { unit: "Copies/mL", ref: "0 - 0" },
            "Specific Gravity (UA) [Sp.gr.]": { unit: "-", ref: "1.0030 - 1.035" },
            "pH(UA)": { unit: "-", ref: "4.50 - 8" },
            "Protein(UA)": { unit: "-", ref: "Negative" },
            "Sugar(UA)": { unit: "-", ref: "Negative" },
            "WBC(UA)": { unit: "-", ref: "0-5" }
        };

        let currentTab = 'MR';
        let selectedLabs = [];
        let mrDrugs = [""]; 

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            ['MR', 'ADR', 'HIV'].forEach(t => {
                document.getElementById(`form-${t}`).classList.add('hidden');
            });
            document.getElementById(`form-${tab}`).classList.remove('hidden');
            generateOutput();
        }

        /* ----- ฟังก์ชันจัดการรายการยา MR ----- */
        function renderMrDrugs() {
            const container = document.getElementById('mrDrugContainer');
            container.innerHTML = '';
            mrDrugs.forEach((drug, index) => {
                container.innerHTML += `
                    <div class="flex gap-2 items-center">
                        <span class="font-medium text-gray-500 w-5">${index + 1}.</span>
                        <input type="text" value="${drug}" oninput="updateMrDrug(${index}, this.value)" class="flex-1 rounded-lg border-gray-300 border px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="ระบุชื่อยา ขนาด วิธีใช้ (เช่น amlodipine 10mg 1x1 po pc)">
                        <button onclick="removeMrDrug(${index})" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="ลบรายการนี้">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
            });
            generateOutput();
        }

        function addMrDrugRow() {
            mrDrugs.push("");
            renderMrDrugs();
        }

        function updateMrDrug(index, val) {
            mrDrugs[index] = val;
            generateOutput();
        }

        function removeMrDrug(index) {
            mrDrugs.splice(index, 1);
            if (mrDrugs.length === 0) mrDrugs.push(""); 
            renderMrDrugs();
        }

        /* ----- ฟังก์ชันจัดการ HIV และทั่วไป ----- */
        function toggleAllergyInput() {
            const isChecked = document.getElementById('mrAllergyCheck').checked;
            const input = document.getElementById('mrAllergyDetail');
            isChecked ? input.classList.remove('hidden') : input.classList.add('hidden');
        }

        function toggleHivType() {
            const isRefill = document.querySelector('input[name="hivType"]:checked').value === 'refill';
            if (isRefill) {
                document.getElementById('hivRefillSection').classList.remove('hidden');
                document.getElementById('hivReferSection').classList.add('hidden');
            } else {
                document.getElementById('hivRefillSection').classList.add('hidden');
                document.getElementById('hivReferSection').classList.remove('hidden');
            }
        }

        function toggleReferInput(id) {
            const isChecked = document.getElementById(`chk${id}`).checked;
            const input = document.getElementById(`txt${id}`);
            isChecked ? input.classList.remove('hidden') : input.classList.add('hidden');
        }

        function addLab() {
            const select = document.getElementById('labSelect');
            const labName = select.options[select.selectedIndex].value;
            const labVal = document.getElementById('labValue').value;
            
            if (labName && labVal) {
                selectedLabs.push({ name: labName, val: labVal });
                document.getElementById('labValue').value = '';
                select.selectedIndex = 0;
                renderLabTags();
                generateOutput();
            }
        }

        function removeLab(index) {
            selectedLabs.splice(index, 1);
            renderLabTags();
            generateOutput();
        }

        function renderLabTags() {
            const container = document.getElementById('labTags');
            container.innerHTML = '';
            selectedLabs.forEach((lab, index) => {
                const ref = labStandards[lab.name];
                const text = `${lab.name}: ${lab.val} ${ref.unit} (ปกติ: ${ref.ref})`;
                container.innerHTML += `
                    <span class="inline-flex items-center gap-1 bg-white border border-indigo-200 text-indigo-800 text-xs font-medium px-2.5 py-1.5 rounded-full shadow-sm">
                        ${text}
                        <button onclick="removeLab(${index})" class="text-indigo-400 hover:text-red-500 font-bold ml-1 focus:outline-none">&times;</button>
                    </span>
                `;
            });
        }

        function resetForm() {
            if(confirm('ต้องการล้างข้อมูลคนไข้ทั้งหมดหรือไม่?')) {
                document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(el => el.value = '');
                document.querySelectorAll('input[type="checkbox"]').forEach(el => {
                    el.checked = false;
                    const event = new Event('change');
                    el.dispatchEvent(event);
                });
                document.querySelector('input[name="mrType"][value="phone"]').checked = false;
                document.querySelector('input[name="mrType"][value="patient"]').checked = false;
                document.querySelector('input[name="hivType"][value="refill"]').checked = true;
                
                selectedLabs = [];
                mrDrugs = [""];
                renderLabTags();
                renderMrDrugs();
                toggleHivType();
                generateOutput();
            }
        }

        function generateOutput() {
            let notes = [];
            
            if (currentTab === 'MR') {
                const place = document.getElementById('mrPlace').value;
                const date = document.getElementById('mrDate').value;
                const validDrugs = mrDrugs.filter(d => d.trim() !== '');
                const hasAllergy = document.getElementById('mrAllergyCheck').checked;
                const herb = document.getElementById('mrHerb').value;
                const pharmTitle = document.getElementById('mrPharmTitle').value;
                const pharmName = document.getElementById('mrPharmName').value;

                if (place || date || validDrugs.length > 0 || hasAllergy || herb || pharmName) {
                    notes.push("pharmacist note");
                    
                    let line1 = [];
                    if (place) line1.push(`ผู้ป่วยรับยาจาก ${place}`);
                    if (date) line1.push(`วันที่ ${date}`);
                    if (line1.length > 0) notes.push(line1.join(' '));

                    if (validDrugs.length > 0) {
                        notes.push("รายการยา");
                        validDrugs.forEach((d, i) => {
                            notes.push(`${i + 1}. ${d}`);
                        });
                    }

                    let allergyText = hasAllergy ? `แพ้ยา/แพ้อาหาร: ${document.getElementById('mrAllergyDetail').value || 'ไม่ระบุ'}` : `แพ้ยา/แพ้อาหาร: ปฏิเสธ`;
                    let herbText = herb ? `สมุนไพร/อาหารเสริม: ${herb}` : `สมุนไพร/อาหารเสริม: -`;
                    notes.push(`${allergyText} | ${herbText}`);

                    if (pharmName) {
                        notes.push(`/${pharmTitle}${pharmName}`);
                    }
                }
            } 
            else if (currentTab === 'ADR') {
                const place = document.getElementById('adrPlace').value;
                const date = document.getElementById('adrDate').value;
                const drug = document.getElementById('adrDrug').value;
                const assess = document.getElementById('adrAssessment').value;
                const pharmTitle = document.getElementById('adrPharmTitle').value;
                const pharmName = document.getElementById('adrPharmName').value;

                if (place || date || drug || assess || pharmName) {
                    notes.push("pharmacist note");
                    
                    let line1 = [];
                    if (place) line1.push(`ผู้ป่วยรับยาจาก ${place}`);
                    if (date) line1.push(`วันที่ ${date}`);
                    if (line1.length > 0) notes.push(line1.join(' '));

                    let line2 = [];
                    if (drug) line2.push(`รายการยา ${drug}`);
                    if (assess) line2.push(`${assess}`); // ไม่แสดงคำว่า "ประเมินว่าเป็นสาเหตุจากยาไหม:"
                    
                    if (line2.length > 0) notes.push(line2.join(' '));
                    
                    if (pharmName) {
                        notes.push(`/${pharmTitle}${pharmName}`);
                    }
                }
            }
            else if (currentTab === 'HIV') {
                const cd4 = document.getElementById('hivCd4').value;
                const vl = document.getElementById('hivVl').value;
                
                notes.push("pharmacist note");
                
                let cd4vl = [];
                if (cd4) cd4vl.push(`CD4(%CD4) ${cd4}`);
                if (vl) cd4vl.push(`VL load ${vl}`);
                if (cd4vl.length > 0) notes.push(cd4vl.join(' '));

                const type = document.querySelector('input[name="hivType"]:checked').value;
                const labPrefix = type === 'refill' ? 'Scr BUN UA + Lab อื่นๆ' : 'Scr BUN UA + Lab อื่นๆที่มีปัญหา';
                
                let labStrings = [];
                if (selectedLabs.length > 0) {
                    let labTexts = selectedLabs.map(lab => {
                        const ref = labStandards[lab.name];
                        return `${lab.name} ${lab.val} ${ref.unit} (ปกติ: ${ref.ref})`;
                    });
                    labStrings.push(labTexts.join(', '));
                }
                const extraLabs = document.getElementById('hivLabsText').value;
                if (extraLabs) labStrings.push(extraLabs);
                
                if (labStrings.length > 0) {
                    notes.push(`${labPrefix}: ${labStrings.join(', ')}`);
                }

                const arv = document.getElementById('hivArv').value;
                if (arv) notes.push(`on ${arv}`);
                
                const days = parseFloat(document.getElementById('hivDays').value);
                const doses = parseFloat(document.getElementById('hivDoses').value);
                if (days && doses) {
                    const missed = parseFloat(document.getElementById('hivMissed').value) || 0;
                    const totalM = days * doses;
                    const taken = totalM - missed;
                    const adPercent = totalM > 0 ? ((taken/totalM)*100).toFixed(2) : 0;
                    notes.push(`นัด ${days}วัน ทานมื้ออาหารวันละ ${doses} มื้อ คือ ${totalM} มื้อ ลืมไป ${missed} มื้อ คือ ${taken}/${totalM}*100= ${adPercent}%`);
                }

                if (type === 'refill') {
                    const rmDate = document.getElementById('hivRmDate').value;
                    const rmMonths = document.getElementById('hivRmMonths').value;
                    const nextLab = document.getElementById('hivNextLab').value;
                    const pharmTitle = document.getElementById('hivPharmTitle').value;
                    const pharmName = document.getElementById('hivPharmName').value;
                    
                    let rmLine = [];
                    if (rmDate) rmLine.push(`rm วันที่ ${rmDate}`);
                    if (rmMonths) rmLine.push(`จำนวน ${rmMonths} เดือน`);
                    if (nextLab) rmLine.push(`+ ${nextLab}`);
                    if (pharmName) rmLine.push(`รคส.พญ.วรวรรณ/${pharmTitle}${pharmName}`);
                    if (rmLine.length > 0) notes.push(rmLine.join(' '));
                } else {
                    let issues = [];
                    ['Ht', 'Dm', 'Dlp', 'Liver', 'Ckd', 'Anemia'].forEach(id => {
                        if(document.getElementById(`chk${id}`).checked) {
                            let label = document.querySelector(`label[for="chk${id}"]`)?.innerText.split(' ')[0] || id; 
                            let val = document.getElementById(`txt${id}`).value;
                            issues.push(val ? `${label} (มี ${val})` : label);
                        }
                    });
                    if (issues.length > 0) {
                        notes.push(`ปรึกษาแพทย์เรื่องมีความผิดปกติของ ${issues.join(' ')}`);
                    }
                    // เพิ่มชื่อผู้ประเมินในกรณี refer
                    const pharmTitle = document.getElementById('hivPharmTitle').value;
                    const pharmName = document.getElementById('hivPharmName').value;
                    if (pharmName) notes.push(`/${pharmTitle}${pharmName}`);
                }
            }
            
            document.getElementById('outputPmk').value = notes.join('\n');
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            if(text) {
                navigator.clipboard.writeText(text).then(() => showToast('คัดลอกลง PMK เรียบร้อยแล้ว!'));
            }
        }

        function copyToSheet() {
            let rowData = Array(18).fill('');
            rowData[0] = document.getElementById('hn').value;
            rowData[1] = document.getElementById('ptName').value;
            
            if (currentTab === 'MR') {
                const mrType = document.querySelector('input[name="mrType"]:checked')?.value;
                if(mrType === 'phone') rowData[3] = '1';
                if(mrType === 'patient') rowData[4] = '1';
                if(document.getElementById('mrAllergyCheck').checked) {
                    rowData[6] = '1'; 
                    rowData[9] = document.getElementById('mrAllergyDetail').value;
                }
                rowData[10] = document.getElementById('mrPlace').value; 
                
                const validDrugs = mrDrugs.filter(d => d.trim() !== '');
                rowData[11] = validDrugs.join(', ');
            } 
            else if (currentTab === 'ADR') {
                rowData[7] = '1';
                rowData[9] = document.getElementById('adrAssessment').value;
            }
            else if (currentTab === 'HIV') {
                const type = document.querySelector('input[name="hivType"]:checked').value;
                if (type === 'refer') {
                    let referDetails = [];
                    if(document.getElementById('chkHt').checked) { referDetails.push(`ความดัน มี ${document.getElementById('txtHt').value}`); rowData[12] = '1'; }
                    if(document.getElementById('chkDm').checked) { referDetails.push(`เบาหวาน มี ${document.getElementById('txtDm').value}`); rowData[13] = '1'; }
                    if(document.getElementById('chkDlp').checked) { referDetails.push(`ไขมัน มี ${document.getElementById('txtDlp').value}`); rowData[14] = '1'; }
                    if(document.getElementById('chkLiver').checked) { referDetails.push(`ตับ มี ${document.getElementById('txtLiver').value}`); rowData[15] = '1'; }
                    if(document.getElementById('chkCkd').checked) { referDetails.push(`CKD มี ${document.getElementById('txtCkd').value}`); rowData[16] = '1'; }
                    if(document.getElementById('chkAnemia').checked) { referDetails.push(`CBC มี ${document.getElementById('txtAnemia').value}`); rowData[17] = '1'; }
                    
                    if(referDetails.length > 0) {
                        rowData[6] = `ส่งพบเรื่อง ${referDetails.join(', ')}`;
                    }
                }
            }

            const tsvString = rowData.join('\t');
            navigator.clipboard.writeText(tsvString).then(() => {
                showToast('คัดลอกข้อมูลสำหรับลง Google Sheet เรียบร้อยแล้ว!');
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initialize UI
        renderMrDrugs();
        generateOutput();
    </script>
</body>
</html>
